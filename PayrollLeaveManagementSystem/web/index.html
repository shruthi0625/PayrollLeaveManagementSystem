<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll & Leave Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-bg: #4f46e5;
            --sidebar-bg: #1e1b4b;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .sidebar { background: var(--sidebar-bg); min-height: 100vh; color: white; }
        .sidebar .nav-link { color: #94a3b8; border-radius: 8px; margin: 4px 0; padding: 10px 16px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #312e81; color: white; }
        .card-stat { border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .card-stat:hover { transform: translateY(-3px); }
        .card-stat.selected { outline: 3px solid #1e1b4b; outline-offset: 2px; }
        .card-stat .hint { font-size: 0.75rem; opacity: 0.8; }
        .badge-pending { background-color: #f59e0b; }
        .badge-approved { background-color: #10b981; }
        .badge-rejected { background-color: #ef4444; }
        .payslip-header { background: linear-gradient(135deg, #4f46e5, #3730a3); color: white; padding: 20px; border-radius: 8px 8px 0 0; }
        .auth-tabs .nav-link { color: #475569; font-weight: 600; }
        .auth-tabs .nav-link.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; background: none; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<!-- ================= LOGIN / REGISTER SCREEN ================= -->
<div id="login-screen" class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-4">
    <div class="card shadow-lg p-4" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-3">
            <i class="fa-solid text-primary fa-wallet fs-1 mb-2"></i>
            <h3 class="fw-bold">Pay & Leave Portal</h3>
            <p class="text-muted small mb-0">Payroll & Leave Management System</p>
        </div>

        <ul class="nav nav-underline auth-tabs justify-content-center mb-3">
            <li class="nav-item"><a class="nav-link active" id="tab-login" href="#" onclick="showAuthTab('login')">Login</a></li>
            <li class="nav-item"><a class="nav-link" id="tab-register" href="#" onclick="showAuthTab('register')">Register</a></li>
        </ul>

        <div id="auth-msg"></div>

        <!-- Login form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="you@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
            <div class="small text-muted mt-3 bg-light p-2 rounded">
                <strong>Demo accounts:</strong><br>
                Admin: admin@company.com / admin123<br>
                Employee: jane@company.com / jane123
            </div>
        </form>

        <!-- Register form -->
        <form id="registerForm" class="d-none" onsubmit="handleRegister(event)">
            <div class="mb-2">
                <label class="form-label">Full Name</label>
                <input type="text" id="regName" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Password</label>
                <input type="password" id="regPassword" class="form-control" minlength="4" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Department</label>
                    <select id="regDept" class="form-select">
                        <option>Engineering</option>
                        <option>Marketing</option>
                        <option>Sales</option>
                        <option>Finance</option>
                        <option>Administration</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">Designation</label>
                    <input type="text" id="regDesig" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Create Account</button>
        </form>
    </div>
</div>

<!-- ================= MAIN APP ================= -->
<div id="dashboard-app" class="d-none">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-3 no-print">
                <div class="d-flex align-items-center mb-4 px-2">
                    <i class="fa-solid fa-layer-group text-primary fs-3 me-2"></i>
                    <h5 class="m-0 fw-bold">PayMaster Pro</h5>
                </div>
                <div class="p-2 bg-dark rounded mb-4 text-center">
                    <div id="nav-user-name" class="fw-bold"></div>
                    <small id="nav-user-role" class="text-secondary"></small>
                </div>
                <nav class="nav flex-column" id="sidebar-nav"></nav>
                <div class="pt-4">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-md-9 col-lg-10 p-4">
                <div id="content-area"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ================= DATA STORE (same structure as the Java classes) =================
const defaultData = {
    employees: [
        { id: "ADM001", name: "Admin", email: "admin@company.com", password: "admin123", dept: "Administration", designation: "Administrator", basic: 90000, hra: 30000, allowances: 15000, leaveQuota: 24, usedLeave: 1, role: "ADMIN" },
        { id: "EMP101", name: "Jane Doe", email: "jane@company.com", password: "jane123", dept: "Engineering", designation: "Senior Developer", basic: 60000, hra: 20000, allowances: 10000, leaveQuota: 18, usedLeave: 3, role: "EMPLOYEE" },
        { id: "EMP102", name: "Alex Smith", email: "alex@company.com", password: "alex123", dept: "Marketing", designation: "Lead Specialist", basic: 50000, hra: 16000, allowances: 8000, leaveQuota: 18, usedLeave: 5, role: "EMPLOYEE" }
    ],
    attendance: [
        { empId: "EMP101", date: "2026-11-08", status: "Present", checkIn: "09:00 AM", checkOut: "05:00 PM" },
        { empId: "EMP101", date: "2026-11-09", status: "Present", checkIn: "09:15 AM", checkOut: "05:15 PM" },
        { empId: "EMP102", date: "2026-11-09", status: "On Leave", checkIn: "-", checkOut: "-" }
    ],
    leaves: [
        { id: "LR-101", empId: "EMP101", type: "Casual Leave", start: "2026-11-12", end: "2026-11-13", days: 2, reason: "Personal work", status: "PENDING" },
        { id: "LR-102", empId: "EMP102", type: "Sick Leave", start: "2026-11-09", end: "2026-11-09", days: 1, reason: "Fever", status: "APPROVED" }
    ]
};

let state = loadData();
state.currentUser = null;

// Save data in the browser so new registrations stay after refresh
function saveData() {
    try {
        localStorage.setItem("payrollData", JSON.stringify({
            employees: state.employees, attendance: state.attendance, leaves: state.leaves
        }));
    } catch (e) { /* storage not available - data stays in memory only */ }
}

function loadData() {
    try {
        const saved = localStorage.getItem("payrollData");
        if (saved) return JSON.parse(saved);
    } catch (e) { }
    return JSON.parse(JSON.stringify(defaultData));
}

// ================= HELPERS =================
function rupees(amount) {
    return "₹" + Number(amount).toLocaleString("en-IN", { maximumFractionDigits: 2 });
}

function esc(text) {
    return String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function isAdmin() {
    return state.currentUser && state.currentUser.role === "ADMIN";
}

function findEmp(id) {
    return state.employees.find(e => e.id === id);
}

function nextEmpId() {
    let max = 100;
    state.employees.forEach(e => {
        const n = parseInt(e.id.replace("EMP", ""));
        if (e.id.startsWith("EMP") && n > max) max = n;
    });
    return "EMP" + (max + 1);
}

// Same formula as PayrollRecord.java
function calcSalary(emp, unpaidLeaves) {
    unpaidLeaves = unpaidLeaves || 0;
    const gross = emp.basic + emp.hra + emp.allowances;
    const leaveDeduction = unpaidLeaves * (gross / 30);
    const afterLeave = gross - leaveDeduction;
    const pf = emp.basic * 0.12;
    const tax = afterLeave * 0.05;
    return { gross, leaveDeduction, pf, tax, net: afterLeave - pf - tax };
}

function myPendingLeaves() {
    return state.leaves.filter(l => l.status === "PENDING" && (isAdmin() || l.empId === state.currentUser.id));
}

// ================= LOGIN & REGISTER =================
function showAuthTab(tab) {
    document.getElementById("auth-msg").innerHTML = "";
    document.getElementById("loginForm").classList.toggle("d-none", tab !== "login");
    document.getElementById("registerForm").classList.toggle("d-none", tab !== "register");
    document.getElementById("tab-login").classList.toggle("active", tab === "login");
    document.getElementById("tab-register").classList.toggle("active", tab === "register");
}

function showAuthMsg(text, type) {
    document.getElementById("auth-msg").innerHTML = `<div class="alert alert-${type} py-2 small">${esc(text)}</div>`;
}

function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const user = state.employees.find(emp => emp.email.toLowerCase() === email && emp.password === password);

    if (!user) {
        showAuthMsg("Wrong email or password.", "danger");
        return;
    }
    state.currentUser = user;
    document.getElementById("loginForm").reset();
    document.getElementById("auth-msg").innerHTML = "";

    document.getElementById("login-screen").classList.add("d-none");
    document.getElementById("dashboard-app").classList.remove("d-none");
    document.getElementById("nav-user-name").innerText = user.name;
    document.getElementById("nav-user-role").innerText = user.role;

    buildNavigation();
    navigate("dashboard");
}

function handleRegister(e) {
    e.preventDefault();
    const email = document.getElementById("regEmail").value.trim();
    if (state.employees.some(emp => emp.email.toLowerCase() === email.toLowerCase())) {
        showAuthMsg("This email is already registered.", "warning");
        return;
    }
    const newEmp = {
        id: nextEmpId(),
        name: document.getElementById("regName").value.trim(),
        email: email,
        password: document.getElementById("regPassword").value,
        dept: document.getElementById("regDept").value,
        designation: document.getElementById("regDesig").value.trim(),
        basic: 30000, hra: 10000, allowances: 5000,   // default salary, Admin can change
        leaveQuota: 18, usedLeave: 0, role: "EMPLOYEE"
    };
    state.employees.push(newEmp);
    saveData();
    document.getElementById("registerForm").reset();
    showAuthTab("login");
    document.getElementById("loginEmail").value = newEmp.email;
    showAuthMsg("Registered successfully! Your ID is " + newEmp.id + ". Please login.", "success");
}

function logout() {
    state.currentUser = null;
    document.getElementById("dashboard-app").classList.add("d-none");
    document.getElementById("login-screen").classList.remove("d-none");
    showAuthTab("login");
}

// ================= NAVIGATION =================
function buildNavigation() {
    const links = [
        ["dashboard", "fa-chart-pie", "Dashboard"],
        ["attendance", "fa-calendar-check", "Attendance"],
        ["leaves", "fa-plane-departure", "Leave Requests"],
        ["payroll", "fa-file-invoice", "Payroll & Payslips"]
    ];
    if (isAdmin()) {
        links.push(["employees", "fa-users", "Employee Management"]);
        links.push(["reports", "fa-chart-line", "Reports"]);
    }
    document.getElementById("sidebar-nav").innerHTML = links.map(l =>
        `<a class="nav-link" href="#" id="nav-${l[0]}" onclick="navigate('${l[0]}')"><i class="fa-solid ${l[1]} me-2"></i>${l[2]}</a>`
    ).join("");
}

function navigate(view) {
    document.querySelectorAll("#sidebar-nav .nav-link").forEach(a => a.classList.remove("active"));
    const link = document.getElementById("nav-" + view);
    if (link) link.classList.add("active");

    const content = document.getElementById("content-area");
    if (view === "dashboard") renderDashboard(content);
    else if (view === "attendance") renderAttendance(content);
    else if (view === "leaves") renderLeaves(content);
    else if (view === "payroll") renderPayroll(content);
    else if (view === "employees") renderEmployees(content);
    else if (view === "reports") renderReports(content);
}

// ================= DASHBOARD =================
function renderDashboard(container, selectedCard) {
    const emp = state.currentUser;
    const remaining = emp.leaveQuota - emp.usedLeave;
    const sel = c => selectedCard === c ? "selected" : "";

    container.innerHTML = `
        <h3 class="fw-bold mb-4">Welcome back, ${esc(emp.name)}! 👋</h3>
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card card-stat bg-primary text-white p-3 shadow-sm ${sel('leave')}" onclick="renderDashboard(document.getElementById('content-area'), 'leave')">
                    <h6>Leave Balance</h6>
                    <h2 class="fw-bold">${remaining} Days</h2>
                    <small>Out of ${emp.leaveQuota} annual days</small>
                    <div class="hint mt-1"><i class="fa-solid fa-hand-pointer"></i> Click for details</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card card-stat bg-success text-white p-3 shadow-sm ${sel('salary')}" onclick="renderDashboard(document.getElementById('content-area'), 'salary')">
                    <h6>Monthly Base Salary</h6>
                    <h2 class="fw-bold">${rupees(emp.basic + emp.hra + emp.allowances)}</h2>
                    <small>Gross regular payout</small>
                    <div class="hint mt-1"><i class="fa-solid fa-hand-pointer"></i> Click for details</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card card-stat bg-warning text-dark p-3 shadow-sm ${sel('pending')}" onclick="renderDashboard(document.getElementById('content-area'), 'pending')">
                    <h6>Pending Requests</h6>
                    <h2 class="fw-bold">${myPendingLeaves().length}</h2>
                    <small>Awaiting Admin Action</small>
                    <div class="hint mt-1"><i class="fa-solid fa-hand-pointer"></i> Click for details</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card card-stat bg-info text-white p-3 shadow-sm ${sel('staff')}" onclick="renderDashboard(document.getElementById('content-area'), 'staff')">
                    <h6>Total Staff Count</h6>
                    <h2 class="fw-bold">${state.employees.length}</h2>
                    <small>Active Team Members</small>
                    <div class="hint mt-1"><i class="fa-solid fa-hand-pointer"></i> Click for details</div>
                </div>
            </div>
        </div>

        <div id="dashboard-details" class="mb-4">${selectedCard ? dashboardDetails(selectedCard) : ""}</div>

        <div class="card shadow-sm p-4">
            <h5 class="fw-bold mb-3">Quick Actions</h5>
            <div class="d-flex gap-2 flex-wrap">
                ${!isAdmin() ? `<button class="btn btn-outline-primary" onclick="navigate('leaves'); showApplyLeaveForm();"><i class="fa-solid fa-plus me-1"></i> Apply for Leave</button>` : ""}
                ${isAdmin() ? `<button class="btn btn-outline-primary" onclick="navigate('employees'); toggleAddEmployee(true);"><i class="fa-solid fa-user-plus me-1"></i> Add Employee</button>` : ""}
                <button class="btn btn-outline-success" onclick="navigate('payroll')"><i class="fa-solid fa-download me-1"></i> View Latest Payslip</button>
            </div>
        </div>
    `;
}

// Content shown below the dashboard cards when one is clicked
function dashboardDetails(card) {
    const emp = state.currentUser;
    let title = "", body = "";

    if (card === "leave") {
        if (isAdmin()) {
            title = "Leave Balance of All Employees";
            body = `<table class="table table-sm align-middle mb-0">
                <thead><tr><th>ID</th><th>Name</th><th>Total</th><th>Used</th><th>Remaining</th></tr></thead>
                <tbody>${state.employees.map(e => `<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${e.leaveQuota}</td><td>${e.usedLeave}</td><td><strong>${e.leaveQuota - e.usedLeave}</strong></td></tr>`).join("")}</tbody>
            </table>`;
        } else {
            const mine = state.leaves.filter(l => l.empId === emp.id);
            title = "My Leave Details";
            body = `<div class="row text-center mb-3">
                    <div class="col"><div class="text-muted small">Total Quota</div><div class="fs-4 fw-bold">${emp.leaveQuota}</div></div>
                    <div class="col"><div class="text-muted small">Used</div><div class="fs-4 fw-bold text-danger">${emp.usedLeave}</div></div>
                    <div class="col"><div class="text-muted small">Remaining</div><div class="fs-4 fw-bold text-success">${emp.leaveQuota - emp.usedLeave}</div></div>
                </div>
                ${leaveTable(mine, false)}`;
        }
    }
    else if (card === "salary") {
        if (isAdmin()) {
            let total = 0;
            const rows = state.employees.map(e => {
                const s = calcSalary(e);
                total += s.gross;
                return `<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${rupees(s.gross)}</td><td>${rupees(s.net)}</td></tr>`;
            }).join("");
            title = "Salary of All Employees";
            body = `<table class="table table-sm align-middle mb-0">
                <thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Gross</th><th>Net Pay</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot><tr class="table-light"><th colspan="3">Total Monthly Payroll (Gross)</th><th colspan="2">${rupees(total)}</th></tr></tfoot>
            </table>`;
        } else {
            const s = calcSalary(emp);
            title = "My Salary Breakdown";
            body = `<table class="table table-sm mb-0">
                <tr><td>Basic Salary</td><td class="text-end">${rupees(emp.basic)}</td></tr>
                <tr><td>HRA</td><td class="text-end">${rupees(emp.hra)}</td></tr>
                <tr><td>Allowances</td><td class="text-end">${rupees(emp.allowances)}</td></tr>
                <tr class="table-light"><th>Gross Salary</th><th class="text-end">${rupees(s.gross)}</th></tr>
                <tr><td>Provident Fund (12%)</td><td class="text-end text-danger">- ${rupees(s.pf)}</td></tr>
                <tr><td>Income Tax (5%)</td><td class="text-end text-danger">- ${rupees(s.tax)}</td></tr>
                <tr class="table-success"><th>Net Salary</th><th class="text-end">${rupees(s.net)}</th></tr>
            </table>`;
        }
    }
    else if (card === "pending") {
        const pending = myPendingLeaves();
        title = isAdmin() ? "Pending Leave Requests (All Employees)" : "My Pending Leave Requests";
        body = pending.length ? leaveTable(pending, isAdmin(), true) : `<p class="text-muted mb-0">No pending requests. 🎉</p>`;
    }
    else if (card === "staff") {
        title = "All Staff Members";
        body = `<table class="table table-sm align-middle mb-0">
            <thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Role</th></tr></thead>
            <tbody>${state.employees.map(e => `<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${esc(e.designation)}</td><td><span class="badge bg-info text-dark">${e.role}</span></td></tr>`).join("")}</tbody>
        </table>`;
    }

    return `<div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0">${title}</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="renderDashboard(document.getElementById('content-area'))"><i class="fa-solid fa-xmark"></i> Close</button>
        </div>
        <div class="table-responsive">${body}</div>
    </div>`;
}

// ================= LEAVES =================
// Reusable table for leave requests
function leaveTable(list, showActions, fromDashboard) {
    if (!list.length) return `<p class="text-muted mb-0 p-3">No leave requests yet.</p>`;
    return `<table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr>
            <th>Request ID</th><th>Employee</th><th>Type</th><th>Duration</th><th>Days</th><th>Reason</th><th>Status</th>
            ${showActions ? "<th>Action</th>" : ""}
        </tr></thead>
        <tbody>${list.map(r => {
            const emp = findEmp(r.empId);
            return `<tr>
                <td><strong>${r.id}</strong></td>
                <td>${emp ? esc(emp.name) : r.empId}</td>
                <td>${esc(r.type)}</td>
                <td>${r.start} to ${r.end}</td>
                <td><span class="badge bg-secondary">${r.days} Day(s)</span></td>
                <td class="small">${esc(r.reason)}</td>
                <td><span class="badge badge-${r.status.toLowerCase()}">${r.status}</span></td>
                ${showActions ? `<td>${r.status === "PENDING" ? `
                    <button class="btn btn-sm btn-success" onclick="updateLeaveStatus('${r.id}', 'APPROVED', ${!!fromDashboard})">Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="updateLeaveStatus('${r.id}', 'REJECTED', ${!!fromDashboard})">Reject</button>
                ` : '<span class="text-muted small">Processed</span>'}</td>` : ""}
            </tr>`;
        }).join("")}</tbody>
    </table>`;
}

function renderLeaves(container) {
    const requests = isAdmin() ? state.leaves : state.leaves.filter(l => l.empId === state.currentUser.id);
    const today = new Date().toISOString().slice(0, 10);

    container.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Leave Management</h3>
            ${!isAdmin() ? `<button class="btn btn-primary" onclick="showApplyLeaveForm()"><i class="fa-solid fa-plus me-1"></i> Apply Leave</button>` : ""}
        </div>

        <div id="apply-leave-card" class="card shadow-sm p-4 mb-4 d-none">
            <h5 class="fw-bold mb-3">Apply for Leave</h5>
            <form onsubmit="submitLeave(event)" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Leave Type</label>
                    <select id="leaveType" class="form-select">
                        <option>Casual Leave</option><option>Sick Leave</option><option>Earned Leave</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Start Date</label>
                    <input type="date" id="leaveStart" class="form-control" min="${today}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">End Date</label>
                    <input type="date" id="leaveEnd" class="form-control" min="${today}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Reason</label>
                    <input type="text" id="leaveReason" class="form-control" required>
                </div>
                <div class="col-12" id="leave-msg"></div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('apply-leave-card').classList.add('d-none')">Cancel</button>
                </div>
            </form>
        </div>

        <div class="card shadow-sm"><div class="card-body p-0 table-responsive">${leaveTable(requests, isAdmin())}</div></div>
    `;
}

function showApplyLeaveForm() {
    const card = document.getElementById("apply-leave-card");
    if (card) card.classList.remove("d-none");
}

function submitLeave(e) {
    e.preventDefault();
    const emp = state.currentUser;
    const start = document.getElementById("leaveStart").value;
    const end = document.getElementById("leaveEnd").value;
    const msg = document.getElementById("leave-msg");
    const days = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;

    if (days < 1) {
        msg.innerHTML = `<div class="alert alert-danger py-2 m-0">End date must be on or after the start date.</div>`;
        return;
    }
    if (days > emp.leaveQuota - emp.usedLeave) {
        msg.innerHTML = `<div class="alert alert-danger py-2 m-0">Not enough leave balance. You have ${emp.leaveQuota - emp.usedLeave} day(s) left.</div>`;
        return;
    }

    let max = 100;
    state.leaves.forEach(l => { const n = parseInt(l.id.replace("LR-", "")); if (n > max) max = n; });

    state.leaves.push({
        id: "LR-" + (max + 1), empId: emp.id,
        type: document.getElementById("leaveType").value,
        start, end, days,
        reason: document.getElementById("leaveReason").value.trim(),
        status: "PENDING"
    });
    saveData();
    navigate("leaves");
}

function updateLeaveStatus(id, newStatus, fromDashboard) {
    const req = state.leaves.find(l => l.id === id);
    if (!req) return;
    req.status = newStatus;
    if (newStatus === "APPROVED") {
        const emp = findEmp(req.empId);
        if (emp) emp.usedLeave += req.days;
    }
    saveData();
    if (fromDashboard) renderDashboard(document.getElementById("content-area"), "pending");
    else navigate("leaves");
}

// ================= ATTENDANCE =================
function renderAttendance(container) {
    const records = isAdmin() ? state.attendance : state.attendance.filter(a => a.empId === state.currentUser.id);

    container.innerHTML = `
        <h3 class="fw-bold mb-4">Attendance Log</h3>
        <div class="card shadow-sm p-3 mb-4">
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <button class="btn btn-success" onclick="clockIn()"><i class="fa-solid fa-clock me-1"></i> Clock In</button>
                <button class="btn btn-danger" onclick="clockOut()"><i class="fa-solid fa-clock-rotate-left me-1"></i> Clock Out</button>
                <span id="att-msg" class="small ms-2"></span>
            </div>
        </div>
        <div class="card shadow-sm table-responsive">
            <table class="table table-striped align-middle m-0">
                <thead><tr><th>Date</th><th>Employee</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
                <tbody>
                    ${records.slice().reverse().map(a => {
                        const emp = findEmp(a.empId);
                        return `<tr>
                            <td>${a.date}</td>
                            <td>${emp ? esc(emp.name) : ""} (${a.empId})</td>
                            <td>${a.checkIn}</td>
                            <td>${a.checkOut}</td>
                            <td><span class="badge ${a.status === "Present" ? "bg-success" : "bg-secondary"}">${a.status}</span></td>
                        </tr>`;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function nowTime() {
    return new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
}

function clockIn() {
    const today = new Date().toISOString().slice(0, 10);
    const id = state.currentUser.id;
    if (state.attendance.some(a => a.empId === id && a.date === today)) {
        document.getElementById("att-msg").innerHTML = `<span class="text-warning">You already clocked in today.</span>`;
        return;
    }
    state.attendance.push({ empId: id, date: today, status: "Present", checkIn: nowTime(), checkOut: "-" });
    saveData();
    navigate("attendance");
}

function clockOut() {
    const today = new Date().toISOString().slice(0, 10);
    const rec = state.attendance.find(a => a.empId === state.currentUser.id && a.date === today);
    if (!rec) {
        document.getElementById("att-msg").innerHTML = `<span class="text-danger">Please clock in first.</span>`;
        return;
    }
    rec.checkOut = nowTime();
    saveData();
    navigate("attendance");
}

    container.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-4">

            <button class="btn btn-primary" onclick="toggleAddEmployee(true)"><i class="fa-solid fa-user-plus me-1"></i> Add Employee</button>

        <div id="add-emp-card" class="card shadow-sm p-4 mb-4 d-none">
            <h5 class="fw-bold mb-3">Add New Employee</h5>
            <form onsubmit="addEmployee(event)" class="row g-3">
                <div class="col-md-4"><label class="form-label">Full Name</label><input id="empName" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label">Email</label><input id="empEmail" type="email" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label">Password</label><input id="empPassword" class="form-control" minlength="4" required></div>

                </div>
                <div class="col-md-4"><label class="form-label">Designation</label><input id="empDesig" class="form-control" required></div>
                <div class="col-md-4">
                    <label class="form-label">Role</label>
                    <select id="empRole" class="form-select"><option value="EMPLOYEE">Employee</option><option value="ADMIN">Admin</option></select>
                </div>
                <div class="col-md-3"><label class="form-label">Basic Salary (₹)</label><input id="empBasic" type="number" min="0" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">HRA (₹)</label><input id="empHra" type="number" min="0" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">Allowances (₹)</label><input id="empAllow" type="number" min="0" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">Annual Leave Quota</label><input id="empQuota" type="number" min="0" value="18" class="form-control" required></div>
                <div class="col-12" id="emp-msg"></div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Save Employee</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="toggleAddEmployee(false)">Cancel</button>
                </div>
            </form>
        </div>

        <div class="card shadow-sm table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Basic Salary</th><th>Role</th><th>Action</th></tr></thead>
                <tbody>
                    ${state.employees.map(e => `
                        <tr>
                            <td>${e.id}</td>
                            <td>${esc(e.name)}</td>
                            <td>${esc(e.email)}</td>
                            <td>${esc(e.dept)}</td>
                            <td>${esc(e.designation)}</td>
                            <td>${rupees(e.basic)}</td>
                            <td><span class="badge bg-info text-dark">${e.role}</span></td>
                            <td>${e.id === state.currentUser.id ? '<span class="text-muted small">You</span>'
                                : `<button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee('${e.id}')"><i class="fa-solid fa-trash"></i></button>`}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function toggleAddEmployee(show) {
    const card = document.getElementById("add-emp-card");
    if (card) card.classList.toggle("d-none", !show);
}

function addEmployee(e) {
    e.preventDefault();
    const email = document.getElementById("empEmail").value.trim();
    if (state.employees.some(emp => emp.email.toLowerCase() === email.toLowerCase())) {
        document.getElementById("emp-msg").innerHTML = `<div class="alert alert-warning py-2 m-0">This email already exists.</div>`;
        return;
    }
    state.employees.push({
        id: nextEmpId(),
        name: document.getElementById("empName").value.trim(),
        email: email,
        password: document.getElementById("empPassword").value,
        dept: document.getElementById("empDept").value,
        designation: document.getElementById("empDesig").value.trim(),
        basic: Number(document.getElementById("empBasic").value),
        hra: Number(document.getElementById("empHra").value),
        allowances: Number(document.getElementById("empAllow").value),
        leaveQuota: Number(document.getElementById("empQuota").value),
        usedLeave: 0,
        role: document.getElementById("empRole").value
    });
    saveData();
    navigate("employees");
}

function deleteEmployee(id) {
    if (!confirm("Delete employee " + id + "?")) return;
    state.employees = state.employees.filter(e => e.id !== id);
    state.leaves = state.leaves.filter(l => l.empId !== id);
    state.attendance = state.attendance.filter(a => a.empId !== id);
    saveData();
    navigate("employees");
}

// ================= REPORTS (Admin) =================
let payrollChart = null;

function renderReports(container) {
    // Total gross salary per department, calculated from employee data
    const totals = {};
    state.employees.forEach(e => {
        totals[e.dept] = (totals[e.dept] || 0) + e.basic + e.hra + e.allowances;
    });
    const depts = Object.keys(totals);

    container.innerHTML = `
        <h3 class="fw-bold mb-4">Payroll Reports</h3>
        <div class="row g-3">
            <div class="col-lg-7">
                <div class="card shadow-sm p-3">
                    <h5 class="fw-bold">Department Payroll Breakdown</h5>
                    <canvas id="chartPayroll"></canvas>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card shadow-sm p-3">
                    <h5 class="fw-bold">Summary</h5>
                    <table class="table table-sm mb-0">
                        ${depts.map(d => `<tr><td>${esc(d)}</td><td class="text-end">${rupees(totals[d])}</td></tr>`).join("")}
                        <tr class="table-light"><th>Total</th><th class="text-end">${rupees(depts.reduce((s, d) => s + totals[d], 0))}</th></tr>
                    </table>
                </div>
            </div>
        </div>
    `;
    setTimeout(() => {
        if (typeof Chart === "undefined") return;
        if (payrollChart) payrollChart.destroy();
        payrollChart = new Chart(document.getElementById("chartPayroll"), {
            type: "bar",
            data: {
                labels: depts,
                datasets: [{
                    label: "Total Gross Salary (₹)",
                    data: depts.map(d => totals[d]),
                    backgroundColor: ["#4f46e5", "#10b981", "#f59e0b", "#0ea5e9", "#ef4444"]
                }]
            }
        });
    }, 100);
}
